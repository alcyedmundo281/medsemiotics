<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PowerSemiotics - Alergias Alimentarias</title>
    <link rel="canonical" href="https://powersemiotics.com/medsemiotics/inmunologia/alergias-alimentarias.html" />

    <link href="../assets/tailwind.css" rel="stylesheet" />

    <!-- React & ReactDOM -->
    <script crossorigin src="../assets/vendor/react/react-18.3.1.production.min.js"></script>
    <script crossorigin src="../assets/vendor/react/react-dom-18.3.1.production.min.js"></script>


    <style>
        @import url('../assets/fonts/fonts.css');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .flip-card {
            perspective: 1000px;
        }

        .flip-card-inner {
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }

        .flip-card-front,
        .flip-card-back {
            backface-visibility: hidden;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .flip-card-back {
            transform: rotateY(180deg);
        }
    </style>
</head>

<body class="font-inter">
    <div id="root"></div>

    <script src="alergias-alimentarias.bundle.js"></script>
</body>

</html>
