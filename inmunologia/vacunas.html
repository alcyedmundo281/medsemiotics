<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PowerSemiotics - Vacunas e Inmunización</title>
    
    <link href="../assets/tailwind.css" rel="stylesheet" />
    
    <!-- React & ReactDOM -->
    <script crossorigin src="../assets/vendor/react/react-18.3.1.production.min.js"></script>
    <script crossorigin src="../assets/vendor/react/react-dom-18.3.1.production.min.js"></script>
    

    <style>
        @import url('../assets/fonts/fonts.css');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0fdf4; /* Tono verde muy suave de fondo */
        }
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .custom-scrollbar::-webkit-scrollbar {
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9; 
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #94a3b8; 
            border-radius: 10px;
        }

        /* Flashcard CSS */
        .flip-card {
            perspective: 1000px;
        }
        .flip-card-inner {
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }
        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }
        .flip-card-front, .flip-card-back {
            backface-visibility: hidden;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .flip-card-back {
            transform: rotateY(180deg);
        }
    </style>
</head>
<body class="font-inter">
    <div id="root"></div>

    <script src="vacunas.bundle.js"></script>
</body>
</html>
