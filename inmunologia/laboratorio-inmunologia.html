<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PowerSemiotics - Laboratorio de Inmunología</title>
    
    <link href="../assets/tailwind.css" rel="stylesheet" />
    
    <!-- React & ReactDOM -->
    <script crossorigin src="../assets/vendor/react/react-18.3.1.production.min.js"></script>
    <script crossorigin src="../assets/vendor/react/react-dom-18.3.1.production.min.js"></script>
    

    <style>
        @import url('../assets/fonts/fonts.css'); /* Inter + Courier Prime (reportes de lab) */
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #faf5ff; /* Tono violeta muy suave */
        }
        .font-mono-lab {
            font-family: 'Courier Prime', monospace;
        }
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .custom-scrollbar::-webkit-scrollbar {
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f3e8ff; 
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #a855f7; 
            border-radius: 10px;
        }

        /* Utilidades para Flashcards 3D */
        .perspective-1000 {
            perspective: 1000px;
        }
        .transform-style-3d {
            transform-style: preserve-3d;
        }
        .backface-hidden {
            backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }
    </style>
</head>
<body class="font-inter">
    <div id="root"></div>

    <script src="laboratorio-inmunologia.bundle.js"></script>
</body>
</html>
