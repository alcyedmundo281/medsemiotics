# Herramientas Python de Medsemiotics. El sitio publicado no depende de nada de aquí:
# este proyecto existe para que los gates (Ruff, mypy estricto, pytest) sean reproducibles.
[project]
name = "medsemiotics-tools"
version = "0.1.0"
description = "Compilador y validador de casos socráticos (ABP dirigido) del blog Medsemiotics"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
]

[dependency-groups]
dev = [
    "mypy>=1.9.0",
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "types-pyyaml>=6.0.12.20240311",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/casos", "tools/imagenes"]

[tool.ruff]
target-version = "py312"
line-length = 100
# generate_topic.py y su test son anteriores a los gates; se incorporarán por separado.
include = [
    "tools/casos/**/*.py",
    "tools/imagenes/**/*.py",
    "tools/tests/test_casos*.py",
    "tools/tests/test_imagenes*.py",
    "tools/tests/conftest.py",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM", "TC", "PTH", "RUF"]
# El texto clínico usa signo menos y raya tipográficos a propósito.
allowed-confusables = ["−", "–", "×"]

[tool.ruff.lint.flake8-type-checking]
# Pydantic resuelve las anotaciones en tiempo de ejecución.
runtime-evaluated-base-classes = ["pydantic.BaseModel", "casos.modelo._Base"]

[tool.ruff.lint.isort]
known-first-party = ["casos", "imagenes"]

[tool.mypy]
python_version = "3.12"
mypy_path = "tools:tools/tests"
files = ["tools/casos", "tools/imagenes", "tools/tests/conftest.py", "tools/tests/test_casos.py", "tools/tests/test_imagenes.py"]
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tools/tests"]
python_files = ["test_casos*.py", "test_imagenes*.py"]
pythonpath = ["tools"]
addopts = "-q -p no:cacheprovider"
