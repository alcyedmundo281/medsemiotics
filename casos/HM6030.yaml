# Caso socrático para Infarto agudo de miocardio (HM:6030).
# El eje docente enlaza la clínica con los modelos de predicción: cada hallazgo es una variable de
# un «modelo» cuyo aporte (el cociente) es transparente y explicable, pero cuya suma ingenua
# supone independencia, no tiene calibración sin probabilidad basal y no está validada fuera de su
# población. Además muestra un cociente positivo menor que 1: el hallazgo presente que aleja el
# diagnóstico. Sirve a la sesión 14 del curso (modelos de predicción e IA clínica).
condicion_id: HM:6030
estado: borrador
autoria:
  autor: Dr. Alcy Torres
  revisor: null
nivel: Pregrado
duracion_min: 45
objetivos:
  - Interpretar un cociente positivo mayor que 1 y uno menor que 1 en hallazgos presentes, y explicar qué significa que un hallazgo presente aleje el diagnóstico.
  - Explicar por qué el producto de cocientes de hallazgos correlacionados sobrestima la probabilidad y qué supone un modelo de este tipo.
  - Distinguir discriminación, calibración y validación externa aplicadas a un conjunto de hallazgos de la base.
  - Reconocer qué ventajas de explicabilidad ofrece un modelo basado en cocientes frente a uno de caja negra.
  - Decidir la conducta ante un paciente con dolor torácico y electrocardiograma con elevación del ST, y ante otro con dolor de características pleuríticas.
vineta:
  titulo: Dos pacientes con dolor de pecho en la misma guardia
  texto: >-
    Esa noche llegan a urgencias dos pacientes por dolor torácico. Paciente A: hombre de 62
    años, con hipertensión y tabaquismo, con un dolor opresivo en el centro del pecho de una
    hora, que se extiende a ambos brazos, con sudoración y sensación de muerte inminente.
    Paciente B: hombre de 27 años, previamente sano, con un dolor punzante en el lado
    izquierdo del pecho de un día, que aumenta al respirar profundo y al acostarse y mejora
    sentado e inclinado hacia adelante; tuvo un cuadro gripal la semana anterior.
  datos:
    - etiqueta: Paciente A, presión arterial
      valor: 96/62 mmHg
    - etiqueta: Paciente A, frecuencia cardíaca
      valor: 104 lpm
    - etiqueta: Paciente B, presión arterial
      valor: 124/78 mmHg
    - etiqueta: Paciente B, frecuencia cardíaca
      valor: 88 lpm
etapas:
  - titulo: Antes de los exámenes
    fase: activacion
    preguntas:
      - pregunta: >-
          ¿Cuál de los dos pacientes te preocupa más por un infarto agudo de miocardio y por
          qué? ¿Con qué probabilidad de partida trabajas en cada uno?
        clave: >-
          El paciente A, por edad, factores de riesgo y características del dolor. Pero
          esa es una intuición: la probabilidad de partida debería ser un número, y esta base
          no registra una probabilidad basal para el infarto. Es una de sus limitaciones y,
          como veremos, también la razón por la que un conjunto de cocientes no es todavía un
          modelo calibrado. Declara tu estimación para cada paciente antes de seguir.
      - pregunta: >-
          Si tuvieras que construir un modelo de predicción a partir de hallazgos clínicos,
          ¿qué tres cosas tendría que cumplir para que lo usaras con un paciente?
        clave: >-
          Discriminar (separar enfermos de no enfermos), estar calibrado (que una
          probabilidad predicha del 30 % corresponda a unos tres de cada diez pacientes) y
          haber sido validado en una población distinta de aquella en la que se construyó.
          Si además es explicable, es decir, si puedes ver cuánto aporta cada variable, es
          más fácil confiar en él y detectar sus errores.
  - titulo: El paciente A, la anamnesis y el examen
    fase: exploracion
    hallazgos: [HM:3014, HM:3132, HM:0109]
    informacion: >-
      El paciente A describe un {{hallazgo HM:3014}}. A la exploración tiene
      {{hallazgo HM:0109}} y a la auscultación se oye un {{hallazgo HM:3132}}.
    preguntas:
      - pregunta: >-
          Ordena los tres hallazgos del paciente A por su capacidad de aumentar la
          probabilidad. ¿Cuál es el más informativo y cuál el menos?
        clave: >-
          El hallazgo «{{hallazgo HM:3014}}» tiene {{lr+ HM:3014}}; el {{hallazgo HM:3132}}, {{lr+ HM:3132}};
          la {{hallazgo HM:0109}}, {{lr+ HM:0109}}. La irradiación es la más informativa de las
          tres; el tercer tono y la hipotensión quedan en un cociente moderado con
          intervalos que se solapan, de modo que la base no permite ordenarlos entre sí.
          Observa que los intervalos son amplios: son aportes aproximados, no exactos.
      - pregunta: >-
          La irradiación a ambos brazos tiene en la base de este infarto un cociente distinto
          del que tiene en la base del síndrome coronario agudo. ¿Cómo es posible?
        clave: >-
          Porque un cociente no es una propiedad del hallazgo sino del hallazgo frente a
          una definición de enfermedad y a una población. Aquí el desenlace es el infarto
          agudo y allá era el síndrome coronario agudo, que incluye casos más leves; el mismo
          hallazgo se compara contra un grupo de comparación distinto. Es un recordatorio de
          que no se traslada un número de una condición a otra.
  - titulo: El electrocardiograma del paciente A
    fase: discriminacion
    hallazgos: [HM:3130]
    informacion: >-
      El electrocardiograma de ingreso muestra {{hallazgo HM:3130}} en las derivaciones
      inferiores.
    preguntas:
      - pregunta: >-
          La elevación del ST tiene el cociente más alto de la serie. Interpreta su magnitud
          y su intervalo.
        clave: >-
          El hallazgo «{{hallazgo HM:3130}}» tiene {{lr+ HM:3130}}: es muy alto, y el
          intervalo, muy amplio, aun en su extremo inferior es un cociente alto. Es el
          hallazgo electrocardiográfico individual más potente para confirmar el infarto con
          indicación de reperfusión. Con un cociente así, el efecto depende de tu pretest:
          calcula el postest con el pretest más bajo y con el más alto que consideres
          razonables, y comprueba si en ambos queda por encima de tu umbral de tratamiento.
  - titulo: El electrocardiograma de control
    fase: discriminacion
    hallazgos: [HM:3131]
    informacion: >-
      Un electrocardiograma de control, repetido a las tres horas del inicio del dolor,
      muestra además {{hallazgo HM:3131}} en esas mismas derivaciones.
    preguntas:
      - pregunta: >-
          Tienes cinco hallazgos que aumentan la probabilidad. Si multiplicas sus cinco
          cocientes, ¿qué obtienes y por qué no puedes fiarte de ese número?
        clave: >-
          Obtienes un cociente combinado enorme, que llevaría la probabilidad casi a la
          certeza. No puedes fiarte porque multiplicar supone independencia condicional: que
          dado el infarto, cada hallazgo aparezca sin relación con los demás. Aquí no es así:
          el hallazgo «{{hallazgo HM:3130}}» y el hallazgo «{{hallazgo HM:3131}}» son dos
          expresiones electrocardiográficas del mismo evento, y la hipotensión y el tercer
          tono reflejan ambos una disfunción ventricular. Contar dos veces la misma
          información sobrestima la probabilidad. Un modelo de este tipo, el llamado
          «ingenuo», discrimina bien pero está mal calibrado.
      - pregunta: >-
          Aun sin calcular, ¿necesitas el producto para decidir qué hacer con el paciente A?
        clave: >-
          No. Con un solo hallazgo, la elevación nueva del ST, la probabilidad ya supera con
          holgura el umbral de tratamiento; el producto añade falsa precisión, no
          información. Es una situación frecuente: cuando un hallazgo cruza el umbral, los
          demás confirman pero no cambian la decisión.
  - titulo: El paciente B
    fase: discriminacion
    hallazgos: [HM:3133, HM:3135, HM:3136, HM:3134]
    informacion: >-
      El dolor del paciente B es {{hallazgo HM:3133}}, {{hallazgo HM:3135}} y
      {{hallazgo HM:3136}} (mejora sentado e inclinado hacia adelante). Además, al
      presionar con el dedo en el borde esternal izquierdo se reproduce el dolor:
      {{hallazgo HM:3134}}.
    preguntas:
      - pregunta: >-
          Los cuatro hallazgos del paciente B tienen cociente positivo menor que 1. ¿Qué
          significa que un hallazgo presente tenga un cociente positivo menor que 1?
        clave: >-
          Que su presencia hace menos probable el diagnóstico. Por ejemplo, el hallazgo
          «{{hallazgo HM:3133}}» tiene {{lr+ HM:3133}}; los otros tres (punzante, posicional y reproducible a la palpación) son {{lr+ HM:3135}},
          {{lr+ HM:3136}} y {{lr+ HM:3134}}, respectivamente. No es una rareza: un hallazgo es informativo cuando su cociente se aleja de
          1 en cualquier sentido, y estos son los síntomas de una causa distinta del
          infarto, como la pericarditis o el dolor osteomuscular. Con valores tan alejados de 1
          la probabilidad baja de forma importante.
      - pregunta: >-
          ¿Puedes multiplicar los cuatro cocientes del paciente B para concluir que no
          tiene infarto?
        clave: >-
          No, por la misma razón que antes, y aquí con más motivo: pleurítico, posicional
          y punzante describen casi lo mismo, el dolor de origen pleuropericárdico o de pared,
          y no son independientes. Además, un producto de varios cocientes pequeños da un
          número tan bajo que aparenta una seguridad que no existe. La fuente dice que estos
          hallazgos hacen el infarto «muy improbable», no imposible, y que no sustituyen al
          electrocardiograma.
      - pregunta: >-
          ¿Qué le exigirías a este conjunto de cocientes para convertirlo en un modelo de
          predicción que usarías en tu servicio?
        clave: >-
          Calibración: partir de una probabilidad basal de tu población, que aquí no está
          documentada. Validación externa: la base procede de una revisión de estudios en
          pacientes con dolor torácico agudo, y no sabemos si aplica a tu servicio o a
          otras poblaciones. Y un tratamiento correcto de la dependencia entre hallazgos, por
          ejemplo con una regresión multivariable en lugar de un producto. Lo que sí tiene es
          explicabilidad: cada hallazgo muestra su aporte y su incertidumbre, algo que un
          modelo de caja negra no ofrece de entrada.
  - titulo: Qué hacer
    fase: decision
    preguntas:
      - pregunta: >-
          ¿Qué haces con cada paciente?
        clave: >-
          Paciente A: activar el protocolo de infarto con elevación del ST, con el
          electrocardiograma en minutos y reperfusión según disponibilidad del servicio. No se
          espera la troponina. Paciente B: electrocardiograma y exploración de todos modos, y
          buscar la causa probable (pericarditis, costocondritis); la clínica que aleja el
          infarto no dispensa del electrocardiograma ni de una troponina si hay alguna duda. El
          manejo de cada causa está fuera de lo que documenta la base.
      - pregunta: >-
          ¿Qué no puede responder la evidencia de este artículo?
        clave: >-
          No registra la probabilidad basal, de modo que la probabilidad posterior de un
          paciente no puede calcularse. No documenta el rendimiento de la troponina ni de las
          escalas de riesgo. Los cocientes proceden de una sola revisión y con intervalos
          amplios. No se estudia la dependencia entre hallazgos, y no distingue infarto con
          elevación del ST de otras formas. Es un buen ejemplo de la distancia entre una
          lista de cocientes y un modelo listo para usar.
cierre:
  sintesis: >-
    En el infarto agudo de miocardio, cada hallazgo es una variable con su aporte y su
    incertidumbre: la elevación del ST confirma, la irradiación apoya, y varios síntomas de
    características pleuríticas o posicionales, aun presentes, alejan el diagnóstico. Combinarlos
    multiplicando supone una independencia que no existe; un modelo útil necesita
    calibración con una probabilidad basal y validación externa, y se beneficia de ser
    explicable.
  necesidades_aprendizaje:
    - >-
      Probabilidad basal de infarto en el dolor torácico agudo, necesaria para calibrar
      cualquier combinación de hallazgos.
    - >-
      Dependencia entre hallazgos y modelos multivariables que la corrijan.
    - >-
      Rendimiento de la troponina de alta sensibilidad y de las escalas de riesgo, no
      registrado en esta condición.
    - >-
      Validación externa de los cocientes en poblaciones distintas de la de los estudios.
    - >-
      Manejo del infarto con elevación del ST y de las causas alternativas de dolor torácico.
omitidos: []
