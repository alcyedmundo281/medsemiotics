# Caso socrático para Meningitis aguda (HM:6004).
# Es el artículo que enseña lo contrario de lo que se espera: los signos meníngeos
# clásicos tienen cocientes que rondan la unidad, es decir que no mueven la
# probabilidad, y la sacudida cefálica tiene sensibilidad y especificidad publicadas
# pero ningún cociente calculable. Lo único que decide es la regla de la tríada y la
# punción lumbar. El paciente del caso tiene la exploración meníngea negativa a
# propósito, para que el estudiante compruebe que eso no descarta nada.
condicion_id: HM:6004
estado: publicado
autoria:
  autor: Dr. Alcy Torres
  revisor: Dr. Alcy Torres
publicacion:
  fecha: 2026-09-24
nivel: Pregrado
duracion_min: 45
objetivos:
  - Reconocer que un cociente de verosimilitud próximo a la unidad indica que el hallazgo no modifica la probabilidad diagnóstica.
  - Distinguir un hallazgo con sensibilidad y especificidad publicadas de un hallazgo con cociente calculable, y explicar por qué la base no lo calcula.
  - Justificar por qué una exploración meníngea negativa no permite descartar una meningitis aguda.
  - Aplicar la regla de la tríada clásica que registra el artículo y reconocer su advertencia sobre el riesgo clínico alto.
  - Decidir la indicación y la secuencia de la punción lumbar y del tratamiento empírico sin esperar a la confirmación.
vineta:
  titulo: Fiebre y dolor de cabeza con un cuello que se mueve bien
  texto: >-
    Varón de 34 años, sin antecedentes, que acude a urgencias por dolor de cabeza intenso
    y continuo desde hace dieciocho horas, distinto de cualquier otro que recuerde, con
    fiebre y malestar general. Ha vomitado tres veces esta mañana y no tolera la luz de la
    sala. Está alerta, contesta con normalidad y colabora en toda la exploración. No ha
    tenido traumatismo craneal, no toma medicación, no refiere cuadro respiratorio previo
    ni contacto con enfermos conocidos. No hay lesiones cutáneas.
  datos:
    - etiqueta: Temperatura
      valor: 38.7 °C
    - etiqueta: Frecuencia cardíaca
      valor: 104 lpm
    - etiqueta: Presión arterial
      valor: 128/74 mmHg
    - etiqueta: Escala de coma de Glasgow
      valor: 15 puntos
etapas:
  - titulo: Lo primero que piensas en la puerta de urgencias
    fase: activacion
    preguntas:
      - pregunta: >-
          Fiebre y la peor cefalea de su vida en un adulto joven. ¿Qué diagnósticos no te
          puedes permitir pasar por alto y con qué urgencia?
        clave: >-
          La meningitis aguda bacteriana encabeza la lista porque el retraso en tratarla
          empeora el pronóstico en horas. También hay que considerar la encefalitis, la
          hemorragia subaracnoidea, el absceso cerebral y la trombosis de senos venosos, y
          en un paciente febril con cefalea intensa conviene pensar en la sinusitis
          complicada y en la otomastoiditis como foco. La prioridad no es el diagnóstico
          más probable, sino el más grave y tratable: el razonamiento aquí es de umbral de
          acción, no de certeza.
      - pregunta: >-
          Antes de explorarlo, ¿qué esperas que la exploración física te aporte? Anótalo y
          compáralo al final del caso.
        clave: >-
          Lo habitual es esperar mucho: la enseñanza clásica presenta los signos meníngeos
          como la clave del diagnóstico. Guarda esa expectativa. La evidencia que registra
          el artículo va a contradecirla, y el valor docente del caso está precisamente en
          ese contraste. La exploración aquí sirve para decidir la actuación, no para
          confirmar ni descartar la enfermedad.
  - titulo: Lo que el paciente refiere
    fase: exploracion
    hallazgos: [HM:0207, HM:0301, HM:0302]
    informacion: >-
      El paciente describe una {{hallazgo HM:0207}} holocraneal, intensa y persistente,
      con {{hallazgo HM:0301}} y {{hallazgo HM:0302}} de repetición desde esta mañana.
      También le molesta la luz.
    preguntas:
      - pregunta: >-
          Estos tres síntomas orientan a una irritación meníngea. ¿Cuánto aumentan la
          probabilidad de meningitis? Mira su estado en las fichas antes de responder.
        clave: >-
          No lo sabemos, y la base lo dice con precisión en lugar de rellenar el hueco. La
          {{hallazgo HM:0207}} tiene una {{sens HM:0207}} publicada, y las
          {{hallazgo HM:0301}} y los {{hallazgo HM:0302}} tienen la suya, pero las tres
          quedan como hallazgos {{estado HM:0207}}: la fuente publica la sensibilidad
          agrupada y no la especificidad, de modo que el cociente no es calculable desde el
          resumen. Sin especificidad no hay cociente, porque el cociente compara la
          frecuencia del hallazgo en enfermos con su frecuencia en no enfermos. Fíjate
          además en que la fuente agrupa las náuseas y los vómitos en una sola estimación:
          no son dos datos independientes que puedas sumar.
      - pregunta: >-
          Si esa {{sens HM:0207}} fuera todo lo que supieras, ¿qué harías con un paciente
          febril que no tiene dolor de cabeza?
        clave: >-
          Seguir considerando la meningitis. Una sensibilidad de ese orden significa que
          una proporción importante de los enfermos no presenta el síntoma, así que su
          ausencia no autoriza a cerrar el diagnóstico. Es la trampa habitual: se recuerdan
          los síntomas como si fueran constantes y se descarta la enfermedad cuando falta
          alguno.
  - titulo: La tríada clásica, componente por componente
    fase: exploracion
    hallazgos: [HM:0101, HM:0501]
    informacion: >-
      Registras {{hallazgo HM:0101}} de 38.7 °C. El paciente está alerta y orientado en
      las tres esferas, con lenguaje normal: no hay {{hallazgo HM:0501}}.
    preguntas:
      - pregunta: >-
          El artículo registra una regla clínica construida sobre la fiebre, la rigidez de
          nuca y la alteración del estado mental. Búscala en el artículo: ¿qué afirma
          exactamente y qué no afirma?
        clave: >-
          Afirma que la ausencia simultánea de los tres descarta la meningitis en la
          práctica, porque la presencia de al menos uno tiene una sensibilidad
          prácticamente total. Es una regla para **descartar**, no para confirmar: tener
          fiebre no confirma nada, y este paciente ya tiene uno de los tres componentes, de
          modo que la regla no lo excluye y el estudio sigue adelante. Lee también su
          advertencia registrada: ante un riesgo clínico alto se va directamente a la
          punción lumbar, sin apoyarse en la exploración. La regla no está para ahorrar
          pruebas en el paciente que preocupa.
      - pregunta: >-
          ¿Por qué la base deja la {{hallazgo HM:0101}} y la {{hallazgo HM:0501}} como
          hallazgos {{estado HM:0101}} si la regla que los usa sí tiene cifras?
        clave: >-
          Porque la fuente mide el conjunto y no cada componente por separado: publica la
          sensibilidad de que al menos uno de los tres esté presente, no el cociente
          aislado de la fiebre ni el de la alteración de la conciencia. La base respeta esa
          diferencia en lugar de repartir el resultado del grupo entre sus partes. Es un
          hábito que conviene llevarse: el rendimiento de una regla combinada no se hereda
          a sus componentes.
  - titulo: Los signos meníngeos que te enseñaron
    fase: discriminacion
    hallazgos: [HM:3005, HM:3238, HM:3239]
    informacion: >-
      Exploras el cuello con el paciente en decúbito supino: la flexión cervical es libre
      y no duele, es decir que no hay {{hallazgo HM:3005}}. Buscas el
      {{hallazgo HM:3238}} y el {{hallazgo HM:3239}}, y ambos son negativos.
    preguntas:
      - pregunta: >-
          Compara los tres cocientes de esta etapa. ¿Qué significa un cociente que vale
          prácticamente uno?
        clave: >-
          Que el hallazgo no aporta información. La {{hallazgo HM:3005}} tiene
          {{lr+ HM:3005}}, el {{hallazgo HM:3238}} tiene {{lr+ HM:3238}} y el
          {{hallazgo HM:3239}}, {{lr+ HM:3239}}. Un cociente igual a la unidad deja la
          probabilidad donde estaba: encontrar el signo no acerca al diagnóstico y no
          encontrarlo tampoco aleja. Comprueba en la calculadora bayesiana del artículo que
          la probabilidad no se mueve. Es un resultado incómodo, porque son los signos que
          más se practican en la cabecera; conviene leer la nota de la ficha, que precisa
          que la fuente solo les halló valor en los pocos pacientes con una pleocitosis
          muy intensa en el líquido cefalorraquídeo.
      - pregunta: >-
          Este paciente tiene los tres signos negativos. ¿Puedes descartar la meningitis y
          mandarlo a casa con analgesia?
        clave: >-
          No, y aquí conviene ser categórico. Además del cociente cercano a la unidad,
          mira la sensibilidad: la {{hallazgo HM:3005}} tiene {{sens HM:3005}} y el
          {{hallazgo HM:3238}} y el {{hallazgo HM:3239}}, {{sens HM:3238}}. La mayoría de
          los pacientes con meningitis confirmada no presenta estos signos, así que su
          ausencia es lo esperable incluso cuando la enfermedad está presente. Descartar
          una meningitis por un cuello que se mueve bien es uno de los errores clásicos, y
          este artículo existe en buena medida para desmontarlo.
      - pregunta: >-
          Si no discriminan, ¿tiene sentido seguir explorándolos?
        clave: >-
          Sí, por dos motivos honestos. Documentan el estado del paciente en un momento
          dado, lo que permite detectar un cambio en la reevaluación, y su presencia
          refuerza la urgencia cuando aparecen en el paciente muy sintomático. Lo que no
          hacen es decidir: la decisión de puncionar no depende de ellos. Explorarlos como
          gesto de cribado para evitar la punción lumbar es usarlos para algo que la
          evidencia no sostiene.
  - titulo: La sacudida cefálica
    fase: discriminacion
    hallazgos: [HM:3006]
    informacion: >-
      Le pides que gire la cabeza horizontalmente dos o tres veces por segundo y refiere
      que el dolor empeora claramente: hay {{hallazgo HM:3006}}.
    preguntas:
      - pregunta: >-
          Esta maniobra sí tiene cifras de rendimiento en la base. ¿Por qué entonces su
          estado es {{estado HM:3006}} y no un cociente?
        clave: >-
          Porque la revisión sistemática que la mide publica las estimaciones agrupadas de
          {{sens HM:3006}} y {{esp HM:3006}}, con una certeza de la evidencia muy baja,
          pero no el cociente, y la base no lo calcula por su cuenta. Podría hacerse la
          aritmética, pero derivar un cociente de dos estimaciones agrupadas por separado,
          procedentes de estudios distintos y con esa incertidumbre, produciría un número
          de apariencia sólida y fundamento frágil. La nota de la ficha añade algo
          importante: la medición cambia al restringirla a los pacientes sin alteración de
          la conciencia, que es el escenario en el que la maniobra tiene sentido, y
          sustituye a un cociente antiguo que provenía de un único estudio.
      - pregunta: >-
          La maniobra es positiva en tu paciente. ¿Qué haces? ¿Y si hubiera sido negativa?
        clave: >-
          En los dos casos, la punción lumbar. Con una especificidad de ese orden, un
          resultado positivo deja bastantes falsos positivos y no confirma nada por sí
          solo; y la decisión registrada en la base para este hallazgo es explícita en el
          otro sentido: una prueba negativa no excluye la meningitis y no evita la punción
          lumbar. Es el resumen del caso: ninguna maniobra de cabecera sustituye al
          análisis del líquido cefalorraquídeo.
  - titulo: Lo que decides en la siguiente hora
    fase: decision
    informacion: >-
      El hemograma muestra leucocitosis con neutrofilia y la proteína C reactiva está
      elevada. No hay focalidad neurológica, ni crisis, ni inmunodepresión conocida, ni
      papiledema en el fondo de ojo.
    preguntas:
      - pregunta: >-
          Ordena las actuaciones de la próxima hora y justifica el orden.
        clave: >-
          Hemocultivos y punción lumbar sin demora, y tratamiento antibiótico empírico
          inmediatamente después de la punción; si la punción se va a retrasar por
          cualquier motivo, el antibiótico va primero, porque el retraso en tratar es lo
          que empeora el pronóstico y los hemocultivos ya extraídos mantienen alguna
          rentabilidad microbiológica. En la sospecha de meningitis bacteriana del adulto
          se administra dexametasona junto con la primera dosis, según el protocolo local.
          En este paciente, sin focalidad, sin crisis, sin inmunodepresión y con nivel de
          conciencia normal, no es necesaria una tomografía previa: pedirla solo añade
          retraso.
      - pregunta: >-
          Vuelve a la nota que escribiste al principio sobre lo que esperabas de la
          exploración física. ¿Qué cambiarías?
        clave: >-
          Que la exploración meníngea no es una prueba diagnóstica: es parte de la
          valoración clínica que sostiene la sospecha y documenta el estado del paciente,
          pero no mueve la probabilidad de forma útil ni autoriza a prescindir de la
          punción lumbar. El hallazgo que en este cuadro realmente decide no está en las
          manos del explorador, sino en el recuento celular del líquido. Saber eso cambia
          la conducta: se punciona antes y se trata antes.
      - pregunta: >-
          ¿Qué límites tiene todo lo que has usado en este caso?
        clave: >-
          El artículo no registra una probabilidad basal: ninguna de las fuentes publica la
          prevalencia en su población, así que la calculadora bayesiana solo permite ver
          el efecto de un hallazgo sobre la probabilidad que tú estimes, no partir de una
          cifra de la base. Las mediciones de los signos clásicos proceden de adultos con
          sospecha de meningitis explorados antes de la punción, con un umbral concreto de
          celularidad para definir la enfermedad, y no se trasladan sin más a niños, a
          inmunodeprimidos ni al paciente ya tratado con antibióticos. Y la evidencia de la
          sacudida cefálica es de certeza muy baja, lo que significa que futuras
          revisiones pueden cambiar la estimación.
cierre:
  sintesis: >-
    La meningitis aguda es el ejemplo más claro de un artículo cuya lección es negativa.
    Los signos meníngeos clásicos tienen cocientes que rondan la unidad y sensibilidades
    bajas: no confirman, y su ausencia no descarta. La sacudida cefálica tiene
    sensibilidad y especificidad publicadas, pero de certeza muy baja y sin cociente
    calculable, y su negatividad no evita la punción lumbar. Lo único con poder para
    descartar es la ausencia simultánea de los tres componentes de la tríada clásica, con
    la advertencia de que, ante un riesgo clínico alto, se punciona igual. La conclusión
    práctica no es explorar mejor, sino puncionar y tratar antes.
  necesidades_aprendizaje:
    - >-
      Probabilidad basal de meningitis aguda entre los pacientes que consultan por cefalea
      y fiebre en urgencias, que ninguna de las fuentes del artículo publica.
    - >-
      Indicaciones de tomografía craneal previa a la punción lumbar y contraindicaciones
      del procedimiento, que la base no documenta.
    - >-
      Rendimiento de los parámetros del líquido cefalorraquídeo y de la reacción en cadena
      de la polimerasa, que es donde reside el diagnóstico y que el artículo no cubre.
    - >-
      Pauta antibiótica empírica según la edad y el factor de riesgo, y el papel de la
      dexametasona, en farmacosemiotics.
    - >-
      Presentación de la meningitis en el lactante y en el anciano, poblaciones a las que
      no se aplican las mediciones de este artículo.
omitidos: []
