# Caso socrático para Hipertensión arterial en adultos (HM:6029).
# El eje docente es la comunicación del riesgo: una presión elevada en consulta es una prueba de
# cribado, no un diagnóstico; el paciente necesita entender qué significa un resultado y qué
# sigue, con frecuencias naturales y sin cifras asustadoras ni tranquilizadoras de más. El caso
# también enseña a leer con espíritu crítico una frase de la ficha que redondea un cociente.
# Sirve a la sesión 15 del curso (comunicar el riesgo y decisión compartida).
condicion_id: HM:6029
estado: borrador
autoria:
  autor: Dr. Alcy Torres
  revisor: null
nivel: Pregrado
duracion_min: 45
objetivos:
  - Explicar a un paciente, con frecuencias naturales y sin jerga, qué significa una presión elevada en la consulta y por qué hace falta confirmarla fuera de ella.
  - Interpretar el cociente positivo y el negativo de la presión en consulta y de la automonitorización domiciliaria.
  - Reconocer que dos mediciones de presión arterial no son pruebas independientes y que sus cocientes no se multiplican.
  - Detectar cuándo una frase descriptiva sobre un cociente lo exagera, comparándola con la cifra registrada.
  - Compartir con el paciente la decisión de confirmar el diagnóstico y cómo hacerlo.
vineta:
  titulo: «Doctor, me subió la presión»
  texto: >-
    Hombre de 46 años, empleado de oficina, que acude a un control de salud laboral. No tiene
    antecedentes de hipertensión. Su padre tuvo un infarto a los 64 años. Se declara
    «nervioso» en los consultorios médicos. Hace poco subió de peso y fuma de forma ocasional.
    Pregunta, preocupado, si «ya tiene la presión alta» y si tendrá que tomar pastillas toda
    la vida.
  datos:
    - etiqueta: Índice de masa corporal
      valor: 29 kg/m²
    - etiqueta: Frecuencia cardíaca
      valor: 82 lpm
    - etiqueta: Circunferencia abdominal
      valor: 98 cm
etapas:
  - titulo: Antes de medir
    fase: activacion
    preguntas:
      - pregunta: >-
          El paciente pregunta si «ya tiene la presión alta». Antes de medírsela, ¿qué
          probabilidad le asignarías de tener hipertensión sostenida y cómo le explicarías
          qué es una probabilidad?
        clave: >-
          La base no registra una probabilidad basal para esta condición, de modo que la
          probabilidad previa es un juicio que debes declarar, apoyado en la edad, el peso
          y el antecedente familiar. Para explicarla a un paciente, evita los porcentajes
          abstractos y usa frecuencias naturales: «de cada 100 hombres como usted, unos X
          tienen la presión alta de forma mantenida». Es más fácil de entender y de recordar
          que un porcentaje o una razón.
      - pregunta: >-
          ¿Qué cuidados debe tener la medición en consulta para que su resultado sea
          interpretable?
        clave: >-
          Reposo previo de algunos minutos, sentado, con el brazo a la altura del corazón,
          manguito del tamaño adecuado, sin hablar, y con más de una medición. Una medición
          mal hecha invalida el cociente que se le aplique después: los cocientes se midieron
          con una técnica determinada y solo aplican si se reproduce.
  - titulo: La presión en la consulta
    fase: exploracion
    hallazgos: [HM:3127]
    informacion: >-
      Con la técnica correcta, en dos mediciones separadas, el paciente tiene una
      {{hallazgo HM:3127}}: el promedio es de 152/94 mmHg.
    preguntas:
      - pregunta: >-
          Interpreta el cociente positivo de la presión elevada en consulta. ¿Qué dice y
          qué no dice sobre este paciente?
        clave: >-
          La {{hallazgo HM:3127}} tiene {{lr+ HM:3127}}: aumenta la probabilidad de forma
          apreciable, pero no al extremo de confirmar el diagnóstico. Por eso la conclusión
          de la fuente la llama prueba de cribado útil. No dice si la hipertensión es
          sostenida o una elevación de bata blanca; eso exige medir fuera de la consulta.
      - pregunta: >-
          La ficha dice que una cifra elevada en consulta «quintuplica aproximadamente la
          odds». Compáralo con el cociente registrado. ¿Es exacto? ¿Importa?
        clave: >-
          El cociente positivo registrado es {{lr+ HM:3127}}: algo más de cuatro veces, no
          cinco, y su intervalo incluye valores bastante más bajos. Y ojo con lo que se
          multiplica: el cociente multiplica las odds (el cociente entre la probabilidad de
          estar enfermo y la de no estarlo), no la probabilidad. Solo con un pretest muy bajo
          la probabilidad se multiplica de forma parecida; con uno moderado o alto, mucho
          menos. Redondear «hacia arriba» exagera el efecto, y confundir odds con
          probabilidad lo exagera aún más. Importa porque en la comunicación del riesgo la
          precisión es parte de la honestidad: decirle al paciente que su probabilidad «se
          multiplica por cinco» lo asusta de más. Es un buen ejercicio de lectura crítica:
          contrastar siempre una frase descriptiva con la cifra con la que se sostiene.
      - pregunta: >-
          Si la presión en consulta hubiera sido normal, ¿qué le dirías?
        clave: >-
          Que la probabilidad de hipertensión baja, pero no desaparece: el
          {{lr- HM:3127}} es un cociente negativo cercano a 1, lo que significa que una
          medición normal en consulta tranquiliza poco. Una persona con presión normal en la
          consulta puede tener hipertensión enmascarada. La conducta es repetir los controles
          periódicamente según riesgo, no darle el alta definitiva.
  - titulo: Medición en casa
    fase: discriminacion
    hallazgos: [HM:3128]
    informacion: >-
      Durante siete días el paciente se mide la presión en casa con un equipo validado,
      dos veces por la mañana y dos por la noche. El promedio es de 128/80 mmHg: no hay
      {{hallazgo HM:3128}}.
    preguntas:
      - pregunta: >-
          La medición en casa es normal. ¿Qué le dices ahora? Interpreta el cociente negativo
          de la automonitorización.
        clave: >-
          La ausencia del hallazgo «{{hallazgo HM:3128}}» corresponde a un {{lr- HM:3128}}:
          reduce de forma clara la probabilidad de hipertensión mantenida, más que la presión
          normal en consulta. Una hipótesis razonable, que la base no documenta, es que la
          medición domiciliaria es repetida y se hace en el ambiente habitual. Con una presión elevada en consulta y normal en casa, la explicación más
          probable es la elevación de bata blanca, aunque sin confirmar con monitorización
          ambulatoria no se puede cerrar el diagnóstico.
      - pregunta: >-
          Tienes dos pruebas, la presión de consulta (positiva) y la de casa (negativa).
          ¿Multiplicas los cocientes de ambas?
        clave: >-
          No. Las dos miden lo mismo, la presión arterial del paciente, en lugares y momentos
          distintos; su error está correlacionado y no son pruebas independientes. Además, el
          resultado de casa contradice al de consulta, y un producto entre un cociente alto y
          uno bajo da un número intermedio que no representa a ninguna de las dos situaciones.
          Cuando las pruebas discrepan se resuelve con una tercera de mejor calidad, no con
          una cuenta.
      - pregunta: >-
          La ficha califica el cociente negativo de la automonitorización de «excelente».
          ¿Estás de acuerdo con ese calificativo?
        clave: >-
          Con prudencia. El {{lr- HM:3128}} reduce la probabilidad de forma útil, pero no la
          lleva a un valor que permita descartar sin más, sobre todo si el pretest era
          moderado. «Excelente» es una valoración de la ficha, no una propiedad de la cifra.
          Al comunicar con el paciente conviene decir lo que la cifra permite: «es poco
          probable, pero queremos confirmarlo».
  - titulo: Hablar con el paciente
    fase: decision
    preguntas:
      - pregunta: >-
          Redacta, en tres frases y con frecuencias naturales, lo que le dirías a este
          paciente sobre su situación y el siguiente paso.
        clave: >-
          Un ejemplo de estructura: «Su presión en el consultorio salió alta, pero en casa
          sale normal; esto le pasa a una parte de las personas que se ponen nerviosas en la
          consulta. Para estar seguros, de cada 100 personas con un resultado como el suyo,
          algunas tienen la presión alta de verdad y otras no; por eso le proponemos
          colocarle un aparato que mide la presión durante 24 horas. Mientras tanto, bajar
          de peso y moverse más le hace bien en cualquier caso.» Lo importante es que el
          paciente sepa qué se sabe, qué no, qué sigue, y que se sienta parte de la decisión.
          Evita decir «usted no tiene nada» y «usted es hipertenso» antes de confirmar.
      - pregunta: >-
          ¿Qué opciones le ofreces y qué decisión compartida hay en este punto?
        clave: >-
          Confirmar con monitorización ambulatoria de 24 horas, repetir la automonitorización
          domiciliaria durante más días, o repetir el control en consulta en unas semanas;
          y, en paralelo, intervenir en el estilo de vida. Se explica el beneficio de
          confirmar (evitar tratar una elevación de bata blanca y no perder una
          hipertensión real) y el costo (tiempo e incomodidad). La preferencia del paciente
          y los recursos del servicio completan la decisión.
      - pregunta: >-
          ¿Qué no puede responder la evidencia de este artículo?
        clave: >-
          No registra la probabilidad basal, el rendimiento de la monitorización ambulatoria
          (que aquí es el estándar para confirmar), ni el riesgo cardiovascular asociado a cada
          nivel de presión. No documenta el umbral de tratamiento ni el beneficio de tratar
          en un paciente como este. Y los cocientes son de una sola revisión sin la población
          detallada en esta base.
cierre:
  sintesis: >-
    La presión elevada en consulta es una prueba de cribado de rendimiento moderado y la
    automonitorización domiciliaria permite discriminar mejor, pero ninguna sustituye a la
    confirmación ambulatoria. Comunicar el riesgo implica usar frecuencias naturales, no
    exagerar los cocientes y compartir con el paciente el siguiente paso.
  necesidades_aprendizaje:
    - >-
      Probabilidad basal de hipertensión sostenida en consulta de control, no documentada en
      la base.
    - >-
      Rendimiento de la monitorización ambulatoria de 24 horas, que es el estándar contra el
      que se leen estos cocientes.
    - >-
      Riesgo cardiovascular asociado a cada nivel de presión y umbrales de tratamiento.
    - >-
      Hipertensión enmascarada y de bata blanca: frecuencia y pronóstico.
omitidos: []
