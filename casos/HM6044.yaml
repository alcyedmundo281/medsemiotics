# Caso socrático para Tromboembolia pulmonar (HM:6044).
# El eje docente es la asimetría de dos pruebas: el dímero D sirve para descartar (su valor está
# en el cociente negativo, y solo si la sospecha es baja o intermedia) y la ecocardiografía a pie
# de cama sirve para actuar en el paciente inestable (sensibilidad baja: un ventrículo derecho
# normal no descarta). Sirve a la sesión 7 del curso (umbrales de prueba y de tratamiento).
condicion_id: HM:6044
estado: borrador
autoria:
  autor: Dr. Alcy Torres
  revisor: null
nivel: Pregrado
duracion_min: 45
objetivos:
  - Declarar y justificar una probabilidad clínica pretest de tromboembolia pulmonar, reconociendo que la base no la documenta.
  - Explicar por qué un dímero D elevado no confirma y uno normal puede descartar, y en qué estrato de sospecha es válido ese uso.
  - Interpretar el cociente positivo y el negativo de la dilatación del ventrículo derecho en la ecografía a pie de cama.
  - Explicar por qué un ventrículo derecho normal no descarta la tromboembolia pulmonar.
  - Decidir qué prueba pedir según la estabilidad hemodinámica, con la lógica de umbrales de prueba y de tratamiento.
vineta:
  titulo: Falta de aire y dolor al respirar
  texto: >-
    Mujer de 38 años que consulta a urgencias por falta de aire de dos días y un dolor en el
    costado derecho que aumenta al inspirar. Toma anticonceptivos orales combinados desde
    hace tres años. Hace tres semanas viajó en bus durante once horas. No tiene tos con
    expectoración, ni fiebre, ni antecedentes de trombosis. No hay hinchazón ni dolor en las
    piernas. Fumadora ocasional.
  datos:
    - etiqueta: Presión arterial
      valor: 118/74 mmHg
    - etiqueta: Frecuencia cardíaca
      valor: 106 lpm
    - etiqueta: Frecuencia respiratoria
      valor: 22 rpm
    - etiqueta: Temperatura
      valor: 36.9 °C
etapas:
  - titulo: Antes de pedir pruebas
    fase: activacion
    preguntas:
      - pregunta: >-
          ¿Qué diagnósticos deben considerarse en una mujer joven con disnea y dolor
          pleurítico? ¿Cuál no puede pasarse por alto y por qué?
        clave: >-
          Tromboembolia pulmonar, neumonía, neumotórax, pleuritis viral, pericarditis,
          síndrome coronario agudo y causa musculoesquelética. La tromboembolia pulmonar es
          la que no puede pasarse por alto porque es potencialmente mortal, es tratable y su
          cuadro es inespecífico: se presenta con síntomas que otras causas explican igual
          de bien.
      - pregunta: >-
          ¿Qué datos de la historia aumentan tu sospecha de tromboembolia pulmonar, y cómo
          estableces tu probabilidad clínica antes de pedir cualquier prueba?
        clave: >-
          Los anticonceptivos orales y el viaje prolongado son factores de riesgo; la
          ausencia de síntomas en las piernas no excluye, porque muchas veces el trombo
          origen no da clínica. El artículo documenta los factores de riesgo con sus
          magnitudes, pero no registra una probabilidad basal ni cocientes para la clínica:
          la probabilidad pretest es un juicio que debes declarar («baja», «intermedia»,
          «alta») y que normalmente se estructura con una escala validada que esta base no
          incorpora. Declararla es el paso que da sentido a todo lo que sigue.
  - titulo: Lo que muestra la clínica
    fase: exploracion
    hallazgos: [HM:0401, HM:0104, HM:3133, HM:0110]
    informacion: >-
      La paciente presenta {{hallazgo HM:0401}} y {{hallazgo HM:3133}} en el costado
      derecho. Hay {{hallazgo HM:0104}} y la oximetría muestra {{hallazgo HM:0110}} leve. El
      examen de las piernas es normal y la radiografía de tórax no muestra consolidación.
    preguntas:
      - pregunta: >-
          Los cuatro hallazgos son frecuentes en la tromboembolia pulmonar. ¿Por qué no
          basta con sumarlos?
        clave: >-
          Porque la base los documenta con {{estado HM:0401}} y sin cociente: son
          inespecíficos y los comparten casi todas las causas de dolor torácico y disnea. Un
          hallazgo frecuente en la enfermedad pero también frecuente en quienes consultan
          por lo mismo no discrimina. Sirven para construir la sospecha y para definir la
          población en la que se aplicarán las pruebas, no para cuantificarla.
      - pregunta: >-
          La ausencia de hinchazón en las piernas, ¿qué cambia?
        clave: >-
          Muy poco: la tromboembolia pulmonar puede ocurrir con una exploración de piernas
          normal y esta base no cuantifica el valor de ese hallazgo. Como no tiene cociente
          medido, no se puede restar probabilidad por él, aunque su ausencia tranquilice: es un
          dato clínico sin peso cuantificado.
  - titulo: El dímero D
    fase: discriminacion
    hallazgos: [HM:3144]
    informacion: >-
      Con una probabilidad clínica que juzgas intermedia, se pide dímero D. El resultado
      es un {{hallazgo HM:3144}}: queda por encima del corte ajustado por edad.
    preguntas:
      - pregunta: >-
          El dímero D está elevado. ¿Confirma la tromboembolia pulmonar? ¿Para qué sirve
          entonces esta prueba?
        clave: >-
          No confirma: se eleva en el embarazo, el posoperatorio, la infección, el cáncer y
          la edad, y la base no registra un cociente positivo para él. Su valor documentado
          es el cociente negativo, {{lr- HM:3144}}: un dímero D por debajo del corte permite
          descartar el diagnóstico sin tomografía. Una prueba «sensible» se usa por su
          resultado normal. Aquí el resultado fue elevado, así que no aporta nada para
          decidir y la paciente necesita una prueba de imagen.
      - pregunta: >-
          ¿Para qué pacientes es válido usar el dímero D para descartar? ¿Qué harías con un
          dímero D normal si tu sospecha clínica fuera alta?
        clave: >-
          La ficha limita su uso a pacientes con probabilidad clínica baja o intermedia.
          Con sospecha alta no se debe pedir para descartar: un resultado normal no debería
          cerrar el estudio, porque la probabilidad previa es tan alta que incluso un
          cociente negativo pequeño deja una probabilidad posterior inaceptable. Es el
          mismo principio de umbrales: la prueba solo sirve si su resultado puede cruzar el
          umbral de prueba.
  - titulo: Dos horas después
    fase: discriminacion
    hallazgos: [HM:3162]
    informacion: >-
      Mientras esperan la tomografía, la paciente se pone pálida y sudorosa y la presión
      baja a 82/50 mmHg. Al colocar el transductor sobre el tórax ves un {{hallazgo HM:3162}}, con el
      tabique desplazado hacia el ventrículo izquierdo.
    preguntas:
      - pregunta: >-
          La paciente está inestable y la ecografía muestra el ventrículo derecho dilatado.
          ¿Cuánto aporta ese hallazgo y qué justifica hacer?
        clave: >-
          El {{hallazgo HM:3162}} tiene {{lr+ HM:3162}} y {{esp HM:3162}}. Esa
          capacidad de evitar falsos positivos es útil, pero el cociente es moderado. La ficha lo pone en contexto:
          en el paciente inestable, un hallazgo inequívoco de sobrecarga del ventrículo
          derecho apoya fuertemente la embolia pulmonar masiva y justifica considerar la
          reperfusión de emergencia si la angiotomografía no es viable. El cociente es
          moderado en términos estadísticos, pero la probabilidad previa en una paciente
          con shock y factores de riesgo ya es alta, y la urgencia de actuar baja el umbral
          de tratamiento.
      - pregunta: >-
          Supón que el ventrículo derecho hubiera sido normal. ¿Descartas la tromboembolia
          pulmonar?
        clave: >-
          No. La {{sens HM:3162}} es limitada y el {{lr- HM:3162}} apenas reduce la
          probabilidad. La advertencia de la ficha es explícita: un ventrículo derecho de
          tamaño y función normales no descarta una embolia submasiva o de bajo riesgo
          hemodinámico. En un paciente inestable con ventrículo derecho normal, además,
          hay que buscar otras causas del shock.
      - pregunta: >-
          Compara las dos pruebas: el dímero D descarta pero no confirma; la ecografía
          confirma de forma moderada pero no descarta. ¿Se pueden usar indistintamente?
        clave: >-
          No: responden preguntas distintas en pacientes distintos. El dímero D se usa en
          el paciente estable con sospecha baja o intermedia, para evitar una tomografía; la
          ecografía a pie de cama se usa en el inestable, para orientar una decisión
          inmediata. Ni una ni otra reemplaza a la imagen de referencia, que esta base no
          documenta.
  - titulo: Qué hacer
    fase: decision
    preguntas:
      - pregunta: >-
          Con la paciente inestable y sospecha alta, ¿qué pedirías y qué tratarías sin
          esperar?
        clave: >-
          Con inestabilidad hemodinámica y sospecha alta, la conducta es tratar sin esperar
          la confirmación si la imagen no puede hacerse de inmediato: anticoagulación
          urgente y valoración de reperfusión (trombólisis o procedimiento), con soporte
          hemodinámico. Es la aplicación directa del umbral de tratamiento: cuando la
          probabilidad es alta y el riesgo de esperar es la muerte, se trata antes de
          confirmar. Los detalles terapéuticos están fuera de lo que documenta la base.
      - pregunta: >-
          ¿Qué no puede responder la evidencia de este artículo?
        clave: >-
          No hay probabilidad basal ni cocientes para la clínica. El dímero D tiene solo
          cociente negativo y sin intervalo de confianza publicado. No se documenta la
          angiotomografía ni las escalas de probabilidad clínica. La población del
          cociente de la ecografía es de sospecha clínica con estudio a pie de cama: el
          rendimiento depende de quién lo hace. Y no hay información sobre tratamiento ni
          sobre estratificación del riesgo del paciente estable.
cierre:
  sintesis: >-
    En la tromboembolia pulmonar la clínica no se cuantifica y la probabilidad pretest es un
    juicio que se declara. El dímero D sirve para descartar con sospecha baja o intermedia y
    no confirma; la dilatación del ventrículo derecho en la ecografía es específica pero poco
    sensible: apoya la decisión de actuar en el paciente inestable y su ausencia no descarta.
  necesidades_aprendizaje:
    - >-
      Escalas de probabilidad clínica pretest (por ejemplo Wells o Ginebra) y su efecto sobre
      el uso del dímero D, no incorporadas en la base.
    - >-
      Cocientes de los hallazgos clínicos y de la oximetría, marcados como no medidos.
    - >-
      Rendimiento de la angiotomografía pulmonar y de la gammagrafía de ventilación y perfusión.
    - >-
      Estratificación de riesgo del paciente estable y manejo anticoagulante, no documentados.
    - >-
      Cociente positivo del dímero D y su comportamiento en poblaciones especiales (embarazo,
      cáncer, edad avanzada).
omitidos: []
