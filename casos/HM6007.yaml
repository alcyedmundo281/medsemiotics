# Caso socrático para Síndrome coronario agudo (HM:6007).
# El eje docente es que en el dolor torácico de urgencias ningún hallazgo del electrocardiograma
# ni de la anamnesis confirma ni descarta por sí solo: los cocientes son moderados y sus
# intervalos, amplios. Lo que cambia la decisión son las escalas que incorporan la troponina.
# Sirve a la sesión 4 del curso (de sensibilidad y especificidad a cociente de verosimilitud)
# y a la sesión 9 (leer el intervalo de confianza de un cociente).
condicion_id: HM:6007
estado: borrador
autoria:
  autor: Dr. Alcy Torres
  revisor: null
nivel: Pregrado
duracion_min: 45
objetivos:
  - Estimar la probabilidad de partida de síndrome coronario agudo en un paciente que consulta a urgencias por dolor torácico agudo.
  - Distinguir, entre los hallazgos de anamnesis y electrocardiograma, cuáles desplazan más la probabilidad y por qué una especificidad alta no basta.
  - Interpretar el cociente positivo del descenso del segmento ST junto con su intervalo de confianza.
  - Explicar por qué ni la anamnesis, ni la exploración, ni el electrocardiograma aislados confirman o descartan el diagnóstico.
  - Decidir la conducta inicial reconociendo qué aporta una escala con troponina y qué no documenta la base.
vineta:
  titulo: Presión en el pecho que se va a los dos brazos
  texto: >-
    Hombre de 58 años que llega a urgencias por presión retroesternal de unos cuarenta
    minutos, que se extiende hacia ambos brazos y se acompaña de sudoración y náuseas. Empezó
    en reposo, mientras miraba televisión. Fuma desde hace treinta años, tiene diabetes tipo 2
    en tratamiento y desde hace un tiempo se le acalambran las pantorrillas al caminar unas
    pocas cuadras. Hace dos años le hicieron una prueba de esfuerzo por dolor de pecho, de la
    que no recuerda el resultado exacto, sino que «salió alterada». No toma antiagregantes.
  datos:
    - etiqueta: Presión arterial
      valor: 148/88 mmHg
    - etiqueta: Frecuencia cardíaca
      valor: 92 lpm
    - etiqueta: Frecuencia respiratoria
      valor: 20 rpm
    - etiqueta: Saturación de oxígeno
      valor: 96 % al aire ambiente
etapas:
  - titulo: Antes de leer el electrocardiograma
    fase: activacion
    preguntas:
      - pregunta: >-
          ¿Qué causas de dolor torácico agudo no debes dejar de considerar en este paciente y
          con qué probabilidad de partida de síndrome coronario agudo trabajas?
        clave: >-
          Las que amenazan la vida van primero: síndrome coronario agudo, disección aórtica,
          embolia pulmonar y neumotórax a tensión; después las frecuentes y benignas, como la
          causa musculoesquelética o el reflujo. La probabilidad de partida no es una
          corazonada: el artículo registra la probabilidad basal del síndrome coronario agudo
          en pacientes que acuden a urgencias por dolor torácico agudo, y es menor de lo que la
          urgencia sugiere. Búscala y escríbela antes de seguir, porque la mayoría de quienes
          consultan por dolor de pecho no tienen un síndrome coronario agudo.
      - pregunta: >-
          Con la historia que cuenta, ¿qué datos de la anamnesis te inclinan hacia el
          síndrome coronario agudo y cuáles te harían dudar?
        clave: >-
          A favor: presión retroesternal en reposo, irradiación, sudoración y náuseas, y el
          perfil de riesgo del paciente. En contra o neutros: el dolor que cambia con la
          respiración o la palpación, o que dura segundos. Lo importante es que cada uno de
          estos datos tiene un peso distinto, y la base solo cuantifica algunos; el resto es
          juicio clínico que conviene reconocer como tal.
  - titulo: Lo que cuenta el paciente y lo que se sabe de él
    fase: exploracion
    hallazgos: [HM:0206, HM:3014, HM:3018, HM:3017]
    informacion: >-
      El motivo de consulta es {{hallazgo HM:0206}} agudo. El paciente lo describe como
      {{hallazgo HM:3014}}. Tiene {{hallazgo HM:3018}}, con claudicación a pocas cuadras, y
      una {{hallazgo HM:3017}} de hace dos años.
    preguntas:
      - pregunta: >-
          El dolor torácico es el motivo de consulta. ¿Cuánto aumenta la probabilidad de
          síndrome coronario agudo?
        clave: >-
          Nada, por diseño: la base registra el {{hallazgo HM:0206}} como hallazgo
          {{estado HM:0206}}, porque es lo que define a la población en la que se midieron los
          demás hallazgos. Es el motivo por el que el paciente entró en la población, no una
          prueba dentro de ella; por eso el punto de partida es la probabilidad basal de
          «pacientes con dolor torácico agudo».
      - pregunta: >-
          La irradiación a ambos brazos, la enfermedad arterial periférica y la prueba de
          esfuerzo anormal tienen especificidad alta. ¿Por qué entonces cada una desplaza tan
          poco la probabilidad?
        clave: >-
          Porque una especificidad alta no basta: lo que mueve la probabilidad es el cociente
          positivo, y este depende también de la sensibilidad, que aquí es baja. El
          {{hallazgo HM:3014}} tiene {{esp HM:3014}} y un {{lr+ HM:3014}}; la
          {{hallazgo HM:3018}} tiene {{esp HM:3018}} y {{lr+ HM:3018}}; la
          {{hallazgo HM:3017}} tiene {{esp HM:3017}} y {{lr+ HM:3017}}. Los tres son
          cocientes modestos, de la misma magnitud, y sus intervalos se solapan: la base no
          permite decir que uno pese más que otro. Y obsérvese qué son: dos de ellos son
          antecedentes, no hallazgos de hoy.
      - pregunta: >-
          Si el paciente no hubiera referido irradiación a los dos brazos, ¿qué
          concluirías?
        clave: >-
          Nada. La ficha lo dice sin rodeos: cuando aparece apoya, y su ausencia no dice
          nada. La base solo registra el cociente positivo de este hallazgo, no uno negativo,
          de modo que no existe un número con el que reducir la probabilidad por su ausencia.
          Un hallazgo específico pero poco sensible sirve para sumar cuando está presente y
          no para restar cuando falta.
  - titulo: El electrocardiograma
    fase: discriminacion
    hallazgos: [HM:3016, HM:3015]
    informacion: >-
      El electrocardiograma de doce derivaciones no muestra elevación del segmento ST. Sí
      hay {{hallazgo HM:3016}} y, en las derivaciones laterales, un franco
      {{hallazgo HM:3015}}.
    preguntas:
      - pregunta: >-
          Hay descenso del segmento ST. ¿Es suficiente para confirmar el síndrome coronario
          agudo? Fundamenta con el cociente y con su intervalo.
        clave: >-
          No. El {{hallazgo HM:3015}} es el hallazgo aislado más útil que registra la base:
          {{lr+ HM:3015}}, con {{esp HM:3015}}. Pero el intervalo de confianza es amplio, y su
          límite inferior es un cociente bajo, de modo que lo único que se puede afirmar es
          que desplaza la probabilidad de forma importante, no cuánto. Con una probabilidad
          de partida baja, ni siquiera el extremo alto del intervalo la lleva a un nivel en
          el que se pueda cerrar el diagnóstico. Calcula con la calculadora bayesiana del
          artículo el postest con el valor central y con cada extremo.
      - pregunta: >-
          Los «signos de isquemia en el electrocardiograma» y el descenso del ST, ¿son lo
          mismo? ¿Qué aporta cada uno?
        clave: >-
          No. Los {{hallazgo HM:3016}} son una categoría más amplia (incluyen alteraciones
          de la onda T, por ejemplo) con {{lr+ HM:3016}}, que es menor que el del descenso
          del ST. Al agrupar hallazgos más inespecíficos se gana sensibilidad y se pierde
          especificidad: el cociente baja. Por eso el informe del electrocardiograma debe
          decir qué se vio, no solo «cambios isquémicos».
      - pregunta: >-
          Supón que el electrocardiograma hubiera sido normal. ¿Descartarías el síndrome
          coronario agudo?
        clave: >-
          No, y es un error frecuente. La base no registra cociente negativo para un
          electrocardiograma normal, y la conclusión de la fuente es que ni la anamnesis, ni
          la exploración, ni el electrocardiograma por sí solos confirman ni excluyen el
          diagnóstico. Un trazado normal al llegar no cierra el caso: se repite y se
          acompaña de troponina.
  - titulo: Qué hacer en este momento
    fase: decision
    preguntas:
      - pregunta: >-
          ¿Cuál es tu conducta inmediata? ¿Qué le pedirías para decidir si lo ingresas, lo
          observas o lo das de alta?
        clave: >-
          Monitorización, acceso venoso, electrocardiograma seriado y troponina de alta
          sensibilidad con repetición según el protocolo del servicio, además del tratamiento
          inicial que corresponda al cuadro. El hallazgo electrocardiográfico y la anamnesis
          orientan, pero la decisión de alta o ingreso se apoya en una escala de riesgo con
          troponina, como HEART o TIMI, que son los instrumentos que la fuente señala como
          más informativos. Si en algún momento aparece elevación del ST, el camino cambia
          hacia la reperfusión inmediata, cuyo manejo está fuera de lo que documenta esta
          base.
      - pregunta: >-
          ¿Por qué la fuente concluye que las escalas con troponina aportan más información
          que la clínica y el electrocardiograma?
        clave: >-
          Porque integran varios datos y, sobre todo, un marcador objetivo de daño
          miocárdico. Los hallazgos de este caso son cociente a cociente modestos y con
          intervalos amplios; la troponina cambia la naturaleza de la información. Una
          escala bien validada puede además llevar a un riesgo bajo que permite el alta con
          seguridad, algo que ningún hallazgo clínico aislado consigue.
      - pregunta: >-
          ¿Qué no puede responder la evidencia de este artículo?
        clave: >-
          Varias cosas. No documenta cociente negativo del electrocardiograma ni de los
          hallazgos de anamnesis presentados, así que ninguno sirve para descartar. No
          registra el rendimiento de la troponina de alta sensibilidad, que es el dato que
          más pesa en la práctica actual. La probabilidad basal es de una población de
          urgencias y no se extrapola a la consulta ambulatoria. Y no cubre el síndrome
          coronario con elevación del ST ni otras causas graves de dolor torácico.
cierre:
  sintesis: >-
    En el dolor torácico agudo de urgencias, el motivo de consulta no discrimina y los
    hallazgos de anamnesis aportan cocientes modestos con intervalos que se solapan. El
    descenso del segmento ST es el hallazgo aislado más útil, y aun así deja una gran
    incertidumbre; un electrocardiograma normal no descarta. La decisión descansa en las
    escalas que incorporan la troponina.
  necesidades_aprendizaje:
    - >-
      Rendimiento diagnóstico de la troponina de alta sensibilidad y de los protocolos de
      repetición a las pocas horas, que la base no registra en esta condición.
    - >-
      Cociente negativo de un electrocardiograma normal, que la fuente no documenta.
    - >-
      Manejo del síndrome coronario agudo con elevación del segmento ST y otras causas graves
      de dolor torácico, fuera del alcance de esta condición.
    - >-
      Tratamiento inicial del síndrome coronario agudo (antiagregación, anticoagulación,
      decisión de estrategia invasiva), no documentado en la base.
omitidos: []
