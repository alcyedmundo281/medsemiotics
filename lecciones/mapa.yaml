# Sílabo vigente de la asignatura: cada semana debe estar cubierta por lecciones del mapa
# («lecciones check» lo exige). Fuente: sílabo UCE 2026-2027 entregado por Alcy E. Torres G.
silabo:
  asignatura: "Medicina Interna 1 – Neurología (MMP06PPP0104), Universidad Central del Ecuador"
  periodo: "2026-2027"
  semanas:
    - semana: 1
      unidad: 1
      tema: "Anamnesis y exploración neurológica: pares craneales, fuerza, sensibilidad, coordinación, reflejos y marcha"
      lecciones: [leccion-examen-neurologico]
    - semana: 2
      unidad: 1
      tema: "Escalas neurológicas: Glasgow, NIHSS, EDSS, Hunt y Hess, Fisher, Rankin modificada, ASPECTS"
      lecciones: [leccion-escalas-neurologicas]
    - semana: 3
      unidad: 2
      tema: "Cefaleas primarias y secundarias, signos de alarma, neuralgia del trigémino"
      lecciones: [leccion-cefaleas]
    - semana: 4
      unidad: 2
      tema: "Enfermedad cerebrovascular isquémica: AIT e infarto cerebral"
      lecciones: [leccion-acv-codigo-ictus]
    - semana: 5
      unidad: 2
      tema: "Enfermedad cerebrovascular hemorrágica: hemorragia intraencefálica y subaracnoidea"
      lecciones: [leccion-ecv-hemorragica]
    - semana: 6
      unidad: 2
      tema: "Epilepsias: crisis sintomática aguda, clasificación, imitadores, encefalopatías epilépticas y del desarrollo"
      lecciones: [leccion-epilepsias]
    - semana: 7
      unidad: 2
      tema: "Síndromes epilépticos selectos: mioclónica juvenil, ausencias, esclerosis hipocampal"
      lecciones: [leccion-epilepsias]
    - semana: 8
      unidad: 2
      tema: "Enfermedades desmielinizantes: esclerosis múltiple, encefalomielitis aguda diseminada"
      lecciones: [leccion-enfermedades-desmielinizantes]
    - semana: 9
      unidad: 2
      tema: "Sistema extrapiramidal: Parkinson, temblor esencial, Huntington, distonías"
      lecciones: [leccion-trastornos-movimiento]
    - semana: 10
      unidad: 2
      tema: "Trastornos neuromusculares: miastenia gravis, miopatías"
      lecciones: [leccion-enfermedades-neuromusculares]
    - semana: 11
      unidad: 2
      tema: "Neuropatías periféricas: parálisis de Bell, túnel carpiano, herpes zóster, neuralgia postherpética, neuropatía diabética"
      lecciones: [leccion-neuropatias, leccion-paralisis-facial-periferica]
    - semana: 12
      unidad: 2
      tema: "Neurodegenerativas: Alzheimer, esclerosis lateral amiotrófica, parkinsonismos atípicos"
      lecciones: [leccion-demencias, leccion-esclerosis-lateral-amiotrofica, leccion-trastornos-movimiento]
    - semana: 13
      unidad: 3
      tema: "Estudios diagnósticos: TC, RM, EEG, conducción nerviosa y electromiografía, punción lumbar y LCR"
      lecciones: [leccion-estudios-diagnosticos]
    - semana: 14
      unidad: 3
      tema: "Principios terapéuticos iniciales y criterios de derivación"
      lecciones: [leccion-tratamiento-inicial-derivacion]
    - semana: 15
      unidad: 4
      tema: "Estado epiléptico, ACV agudo, hipertensión endocraneal, alteración del estado mental"
      lecciones: [leccion-estado-epileptico, leccion-acv-codigo-ictus, leccion-hipertension-intracraneal-adulto, leccion-alteracion-estado-mental]
    - semana: 16
      unidad: 4
      tema: "Crisis hipertensiva neurológica, Guillain-Barré, compresión medular, meningitis bacteriana aguda"
      lecciones: [leccion-encefalopatia-hipertensiva, leccion-debilidad-aguda, leccion-infecciones-snc]
    - semana: 17
      unidad: 5
      tema: "Guías clínicas nacionales e internacionales en el primer nivel de atención"
      lecciones: [leccion-razonamiento-clinico-evidencia]
    - semana: 18
      unidad: 5
      tema: "Guías clínicas nacionales e internacionales en el primer nivel de atención"
      lecciones: [leccion-razonamiento-clinico-evidencia]
