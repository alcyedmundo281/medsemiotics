# Mapa del libro: la fuente única del plan editorial (ADR-001).
#
#   uv run python -m lecciones mapa          → regenera mapa-maestro-libro.md
#   uv run python -m lecciones mapa --check  → coherencia mapa ↔ lecciones (en npm run gates)
#   uv run python -m lecciones nuevo <id>    → crea lecciones/<id>.qmd desde su fila
#
# Una fila del mapa es un plan; la lección real es lecciones/<id>.qmd. El estado de cada
# lección se lee del archivo, nunca se escribe aquí. Todo el texto se reconstruye desde cero:
# los módulos HTML de clase y la obra de 1993 son fuentes, no texto que se copia.
#
# Filas marcadas «propuesta: true» son sugerencias que esperan decisión de los autores.

obra:
  titulo_provisional: "Neurología Clínica y Semiología Basada en la Evidencia"
  licencia: "CC BY-NC-SA 4.0"
  legado: "Torres Catefort A. Neurología Pediátrica. 2.ª ed. Quito: Universidad Central del Ecuador; 1993"
  # Fuera del plan por decisión de los autores (30-oct-2026): cap. XXVI «Reanimación
  # cardiopulmonar» (pp. 185-190), que no es neurología y sigue guías que se actualizan aparte,
  # y la sección de alimentación por sonda nasogástrica del cap. XXV.
  fuentes_previas:
    - "Torres Catefort A. Neuropediatría–Urgencias. Quito: Universidad Central del Ecuador; 1991"

personas:
  atc:
    nombre: "Alcy Torres Catefort"
    rol_obra: autor-fundador
    fallecido: true
    credit: [conceptualizacion]
  artg:
    nombre: "Alcy Ramiro Torres Guerrero"
    orcid: "0000-0001-5798-9161"
    afiliacion: "Boston Medical Center; Boston University Chobanian & Avedisian School of Medicine"
    credit: [redaccion, revision-edicion]
  gtg:
    nombre: "Gladys Torres Guerrero"
    credit: [redaccion, revision-edicion]
  aetg:
    nombre: "Alcy Edmundo Torres Guerrero"
    orcid: "0000-0002-9742-375X"
    afiliacion: "Hospital de Especialidades Carlos Andrade Marín (IESS); Universidad Central del Ecuador"
    rol_obra: coordinacion-editorial
    credit: [redaccion, revision-edicion]

partes:
  - clave: fundamentos
    titulo: "Fundamentos: la semiología basada en la evidencia"
    autores: [aetg]
    revisor: aetg
  - clave: neonato
    titulo: "El recién nacido"
    autores: [atc, artg]
    revisor: artg
  - clave: lactante-nino
    titulo: "El lactante y el niño"
    autores: [atc, artg]
    revisor: artg
  - clave: neuroftalmologia
    titulo: "Neuroftalmología del niño y del adulto"
    autores: [gtg]
    revisor: gtg
    nota: "Temario propuesto para revisión de Gladys Torres Guerrero."
  - clave: adulto
    titulo: "El adulto: síndromes y urgencias"
    autores: [aetg]
    revisor: aetg

